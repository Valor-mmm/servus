<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  role="img"
  aria-label="Servus Löwe"
>
  <!-- Parchment background fill (maskable safe zone) -->
  <rect width="100" height="100" fill="#F4ECDA" />

  <!-- Lion-and-shield centred at 60% of canvas via translate+scale -->
  <g transform="translate(20,20) scale(0.6)">
    <!-- Shield body -->
    <path
      d="M50 8 L88 22 L88 60 Q88 82 50 94 Q12 82 12 60 L12 22 Z"
      fill="#1a5fa8"
      stroke="#154d8a"
      stroke-width="1.5"
    />
    <!-- Shield inner highlight -->
    <path
      d="M50 14 L82 26 L82 60 Q82 78 50 88 Q18 78 18 60 L18 26 Z"
      fill="none"
      stroke="rgba(255,255,255,0.15)"
      stroke-width="1"
    />

    <!-- Lion body (simplified silhouette) -->
    <!-- Torso -->
    <ellipse cx="50" cy="62" rx="16" ry="14" fill="#c5900a" />
    <!-- Head -->
    <circle cx="50" cy="42" r="12" fill="#c5900a" />
    <!-- Mane ring -->
    <circle
      cx="50"
      cy="42"
      r="15"
      fill="none"
      stroke="#a37508"
      stroke-width="4"
      stroke-dasharray="4 2"
    />

    <!-- Eyes -->
    <circle cx="45.5" cy="40" r="2" fill="#1c1612" />
    <circle cx="54.5" cy="40" r="2" fill="#1c1612" />
    <!-- Eye shine -->
    <circle cx="46.2" cy="39.3" r="0.6" fill="white" />
    <circle cx="55.2" cy="39.3" r="0.6" fill="white" />

    <!-- Nose -->
    <ellipse cx="50" cy="44.5" r="1.8" ry="1.2" fill="#a37508" />
    <!-- Mouth -->
    <path
      d="M47 47 Q50 49.5 53 47"
      fill="none"
      stroke="#a37508"
      stroke-width="1.2"
      stroke-linecap="round"
    />

    <!-- Front paws -->
    <ellipse cx="40" cy="74" rx="5" ry="4" fill="#c5900a" />
    <ellipse cx="60" cy="74" rx="5" ry="4" fill="#c5900a" />
    <!-- Paw toes -->
    <path
      d="M37.5 76 Q40 78 42.5 76"
      fill="none"
      stroke="#a37508"
      stroke-width="0.8"
      stroke-linecap="round"
    />
    <path
      d="M57.5 76 Q60 78 62.5 76"
      fill="none"
      stroke="#a37508"
      stroke-width="0.8"
      stroke-linecap="round"
    />

    <!-- Tail -->
    <path
      d="M66 65 Q78 58 76 48 Q74 40 80 36"
      fill="none"
      stroke="#c5900a"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle cx="80" cy="34" r="4" fill="#c5900a" />

    <!-- Crown (simple) -->
    <path
      d="M38 30 L38 24 L42 27 L46 22 L50 26 L54 22 L58 27 L62 24 L62 30 Z"
      fill="#c5900a"
      stroke="#a37508"
      stroke-width="0.8"
      stroke-linejoin="round"
    />
  </g>
</svg>
