<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>servus — Anmelden — Direction B: Hütte</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --loden: #3D5A3E;
    --loden-tief: #2A4129;
    --eiche: #7A4F2B;
    --eiche-dunkel: #553A1F;
    --papier: #FAF5E8;
    --papier-warm: #F2E9D0;
    --tinte: #2A1F12;
    --schnee: #FFFFFF;
    --bayernblau: #1A5FA8;
    --enzian: #C4922A;
    --rot: #8B2D2D;
    --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "EB Garamond", Garamond, "Cormorant Garamond", serif;
    background: var(--papier);
    background-image: var(--noise);
    color: var(--tinte);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--schnee);
    background-image: var(--noise);
    border: 1px solid var(--eiche);
    box-shadow:
      0 1px 0 var(--papier-warm),
      8px 8px 0 -2px rgba(122, 79, 43, 0.15);
    position: relative;
    padding: 48px 48px 40px;
  }
  @media (max-width: 480px) { .card { padding: 32px 24px 28px; } }

  /* Wood-grain double-rule frame */
  .card::before, .card::after {
    content: "";
    position: absolute;
    left: 16px; right: 16px;
    height: 0;
    border-top: 1px solid var(--eiche);
    border-bottom: 1px solid var(--eiche);
    border-bottom-width: 2px;
  }
  .card::before { top: 8px; padding-top: 3px; }
  .card::after { bottom: 8px; padding-top: 3px; }

  /* Ribbon */
  .ribbon {
    position: absolute;
    top: -14px; left: 32px;
    background: var(--bayernblau);
    color: var(--schnee);
    padding: 6px 16px;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .ribbon::after {
    content: "";
    position: absolute;
    right: -8px; top: 0; bottom: 0; width: 8px;
    background: var(--bayernblau);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  .brand {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 28px;
  }
  .brand svg { width: 56px; height: 56px; }
  .brand .wordmark {
    font-family: "EB Garamond", serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    color: var(--loden-tief);
    letter-spacing: -0.01em;
  }
  .brand .wordmark em {
    font-style: italic;
    font-weight: 500;
    color: var(--eiche);
  }
  .brand .tagline {
    display: block;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--eiche);
    margin-top: 4px;
    font-weight: 500;
  }

  h1 {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--tinte);
  }
  h1 em { font-style: italic; color: var(--loden); }

  p.lead {
    font-family: "EB Garamond", serif;
    font-size: 18px;
    line-height: 1.45;
    color: var(--eiche-dunkel);
    margin: 0 0 32px;
    max-width: 38ch;
  }

  form { display: grid; gap: 20px; }

  label {
    display: grid; gap: 6px;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--eiche-dunkel);
  }
  input {
    font: inherit;
    font-family: "EB Garamond", serif;
    font-size: 18px;
    padding: 12px 14px;
    border: none;
    border-bottom: 1.5px solid var(--eiche);
    background: transparent;
    color: var(--tinte);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input:focus { border-bottom-color: var(--loden); background: rgba(196, 146, 42, 0.05); }

  .actions {
    display: flex; align-items: center; gap: 16px;
    margin-top: 8px;
  }
  button.primary {
    font: inherit;
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 19px;
    padding: 12px 28px;
    border: 1.5px solid var(--loden);
    background: var(--loden);
    color: var(--papier);
    cursor: pointer;
    border-radius: 2px;
    box-shadow: 3px 3px 0 var(--eiche);
    transition: transform .08s, box-shadow .08s;
  }
  button.primary:hover { background: var(--loden-tief); }
  button.primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--eiche); }

  .help {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--eiche);
    margin-left: auto;
  }
  .help a { color: var(--loden); }

  .footnote {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px dashed var(--eiche);
    border-top-width: 1px;
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-size: 15px;
    color: var(--eiche-dunkel);
    text-align: center;
  }

</style>
</head>
<body>

  <div class="card">
    <div class="ribbon">Privat &middot; Eingeladen</div>

    <div class="brand">
      <!-- Wood-cut style lion -->
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="40" cy="40" r="36" fill="#FAF5E8" stroke="#7A4F2B" stroke-width="2"/>
        <!-- mane lines -->
        <g stroke="#7A4F2B" stroke-width="1.5" fill="none">
          <path d="M40 8 L40 18"/>
          <path d="M18 18 L25 26"/>
          <path d="M62 18 L55 26"/>
          <path d="M8 40 L18 40"/>
          <path d="M72 40 L62 40"/>
          <path d="M18 62 L25 54"/>
          <path d="M62 62 L55 54"/>
        </g>
        <!-- lion face: triangular -->
        <path d="M28 32 L40 24 L52 32 L52 48 L46 56 L40 58 L34 56 L28 48 Z" fill="#C4922A" stroke="#553A1F" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="34" cy="40" r="1.6" fill="#2A1F12"/>
        <circle cx="46" cy="40" r="1.6" fill="#2A1F12"/>
        <path d="M37 46 L40 50 L43 46 Z" fill="#2A1F12"/>
        <!-- crown bit -->
        <path d="M32 24 L36 20 L40 24 L44 20 L48 24" fill="none" stroke="#553A1F" stroke-width="1.5"/>
      </svg>
      <div>
        <div class="wordmark"><em>s</em>ervus</div>
        <span class="tagline">Haus &amp; Heim</span>
      </div>
    </div>

    <h1>Schee, dass du <em>da bist.</em></h1>
    <p class="lead">Melde dich an, um den Haushalt zu ordnen und die Kartons im Blick zu behalten.</p>

    <form onsubmit="event.preventDefault()">
      <label>
        Benutzername
        <input type="text" name="username" value="monster" autocomplete="username">
      </label>
      <label>
        Passwort
        <input type="password" name="password" value="••••••••" autocomplete="current-password">
      </label>
      <div class="actions">
        <button class="primary" type="submit">Anmelden</button>
        <span class="help">Eingeladen worden? <a href="#">Code einlösen</a></span>
      </div>
    </form>

    <div class="footnote">„Daheim is dort, wo's Glump verrutscht.“</div>
  </div>

</body>
</html>
